[Service]
# After a successful off-site pull, refresh the Turso context DB incrementally (R-095).
# "-" prefix: a refresh failure never marks the backup itself as failed.
ExecStartPost=-%h/.local/bin/habitat-context-refresh
# Then a doctor run: its FAIL marks the unit failed (visible in systemctl --failed and the brief).
ExecStartPost=%h/.local/share/turso/context/habitat-ctx doctor
